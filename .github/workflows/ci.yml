name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-yaml:
    name: Validate YAML Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate docker-compose.yaml syntax
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Validate kong.yaml with yamllint
        run: yamllint -d relaxed kong.yaml

      - name: Validate other YAML files
        run: |
          yamllint -d relaxed prometheus.yaml || true
          yamllint -d relaxed stack.yaml || true
          yamllint -d relaxed dind-cluster.yaml || true